name: Atualizar Dashboard

on:
  schedule:
    - cron: "0 14 * * 1-5"   # 11:00 BRT (14:00 UTC) seg-sex
    - cron: "0 20 * * 1-5"   # 17:00 BRT (20:00 UTC) seg-sex
  workflow_dispatch:           # botão manual

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install openpyxl requests

      - name: Baixar planilha do Google Drive
        run: |
          python3 - << 'PYEOF'
          import requests, os

          file_id = "17ZPm6V--MTZvmeY5xoNhmUCMbc0ByrU8"
          download_url = f"https://drive.google.com/uc?export=download&id={file_id}"

          session = requests.Session()
          r = session.get(download_url, stream=True)

          # Google Drive pede confirmação para arquivos grandes
          token = None
          for key, value in r.cookies.items():
              if key.startswith("download_warning"):
                  token = value
                  break

          if token:
              r = session.get(download_url + f"&confirm={token}", stream=True)

          filename = "Resultado Gerencial 2026.xlsx"
          with open(filename, "wb") as f:
              for chunk in r.iter_content(chunk_size=32768):
                  if chunk:
                      f.write(chunk)

          size = os.path.getsize(filename)
          print(f"✅ Arquivo salvo: {size:,} bytes")
          if size < 10000:
              raise Exception(f"Download falhou — arquivo muito pequeno ({size} bytes)")
          PYEOF

      - name: Gerar data.json a partir do xlsx
        run: python scripts/gerar_dados.py

      - name: Commit e push do data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "chore: atualiza data.json [$(date '+%d/%m/%Y %H:%M' -u -d '+3 hours')]"
          git push
